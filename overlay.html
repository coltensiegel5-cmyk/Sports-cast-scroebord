<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="no-referrer" name="referrer"/><title>Sportscast — OBS Scoreboard Only</title><style>
#nfl-night{font:13px system-ui,-apple-system,sans-serif;background:#0d1729;color:#f1f6ff;border:1px solid #34465f;border-radius:14px;overflow:hidden}
#nfl-night *{box-sizing:border-box}#nfl-night [hidden]{display:none!important}#nfl-night button,#nfl-night input,#nfl-night select{font:inherit}#nfl-night button{cursor:pointer}
#nfl-night .top{padding:15px 18px;background:#15243c;border-bottom:1px solid #344960;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#nfl-night .brand{font-weight:900;font-size:16px}#nfl-night .brand span{background:#305fe1;padding:7px 10px;border-radius:7px;margin-right:6px}#nfl-night .live{font-size:10px;color:#b4ebd0;background:#163d34;border-radius:16px;padding:6px 10px;font-weight:800}
#nfl-night .sports{display:flex;gap:7px;flex-wrap:wrap;padding:10px 15px;border-bottom:1px solid #34465f}#nfl-night .sports span{background:#1b2a42;color:#9daec5;border:1px solid #394d66;border-radius:7px;padding:8px 11px;font-weight:800;font-size:11px}#nfl-night .sports span:first-child{background:#2b60db;color:#fff;border-color:#5988f7}
#nfl-night .content{padding:16px}#nfl-night .titleline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}#nfl-night .titleline b{font-size:16px}#nfl-night .subtitle{font-size:11px;color:#aabbd0;margin-top:4px}
#nfl-night .tabs{background:#172942;border:1px solid #37506d;border-radius:9px;display:flex;gap:3px;padding:4px}#nfl-night .tabs button{background:transparent;color:#b9c8dd;padding:8px 11px;font-weight:850;font-size:11px;border:0;border-radius:6px}#nfl-night .tabs button.active{background:#2f60dc;color:#fff}
#nfl-night .stage{min-height:195px;padding:25px 7px;background:repeating-linear-gradient(0deg,transparent 0,transparent 45px,#ffffff0f 46px,transparent 47px,transparent 92px),linear-gradient(120deg,#173d34,#27584b,#183d34);display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid #45675f;border-radius:11px}#nfl-night .stage.checker{background:#dce2e9;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
#nfl-night .scorebug{width:100%;max-width:960px;height:148px;display:flex;align-items:center;position:relative;container-type:inline-size;filter:drop-shadow(0 5px 6px #0009)}#nfl-night .wing{display:flex;align-items:center;position:relative;width:50%;height:66%;min-width:0;border:2px solid #a7c9d8;box-shadow:inset 0 3px 4px #fff3,inset 0 -5px 6px #0005}#nfl-night .wing.away{border-radius:68px 3px 3px 9px;padding:0 8% 0 2%}#nfl-night .wing.home{border-radius:3px 68px 9px 3px;padding:0 2% 0 8%}#nfl-night .wing:after{content:"";height:2px;left:7%;right:7%;bottom:13%;position:absolute;background:#ffffff75}
#nfl-night .logo{flex:0 0 30%;min-width:0;height:78%;display:grid;place-items:center}#nfl-night .logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px #0008)}#nfl-night .logo .fallback{display:none;font-weight:900;font-size:clamp(12px,3cqw,24px)}#nfl-night .logo.failed img{display:none}#nfl-night .logo.failed .fallback{display:block}
#nfl-night .team{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-bottom:10px}#nfl-night .abbr{font-size:clamp(12px,3.6cqw,31px);font-weight:950;line-height:1}#nfl-night .record{font-weight:800;font-size:clamp(8px,1.7cqw,14px);margin-top:5px}#nfl-night .score{flex:0 0 22%;font-weight:900;text-align:center;font-size:clamp(19px,5.2cqw,45px);padding-bottom:8px;font-variant-numeric:tabular-nums}
#nfl-night .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:clamp(68px,16cqw,122px);height:clamp(68px,16cqw,122px);border:3px solid #bed4e0;box-shadow:0 0 0 3px #1f384d;background:linear-gradient(145deg,#748b9f,#304457 40%,#111a2a 76%,#587188);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}#nfl-night .center .symbol{font-size:clamp(8px,1.5cqw,15px);color:#eaf0f5}#nfl-night .clock{font-weight:950;font-size:clamp(13px,3.15cqw,28px);font-variant-numeric:tabular-nums;line-height:1.18}#nfl-night .clockline{display:flex;align-items:center;gap:4px;font-size:clamp(8px,1.5cqw,13px);font-weight:850}#nfl-night .playclock{background:#ab2945;padding:2px 5px;border-radius:3px}
#nfl-night .postab{position:absolute;top:calc(50% + 33% - 1px);width:36%;height:27px;border-radius:0 0 9px 9px;border:2px solid;display:flex;align-items:center;justify-content:center;gap:6px;z-index:2;box-shadow:0 3px 5px #0005;font-size:clamp(9px,1.85cqw,16px);font-weight:950;white-space:nowrap;text-shadow:0 1px 2px #0009}#nfl-night .postab.away{left:7%}#nfl-night .postab.home{right:7%}
#nfl-night .hint{text-align:center;color:#a8bdd4;font-size:11px;margin:11px 0 13px}#nfl-night .status{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;margin-bottom:14px;border:1px solid #3a506e;background:#172741;border-radius:9px}#nfl-night .status b{font-size:11px}#nfl-night .status small{display:block;color:#b1c4d9;font-size:10px;margin-top:4px;line-height:1.5}
#nfl-night .btn{font-size:11px;font-weight:850;color:#f2f7ff;background:#2b415f;border:1px solid #4c6584;border-radius:7px;padding:8px 11px}#nfl-night .btn.primary{background:#2d61df;border-color:#5a86f7}#nfl-night .btn:hover{filter:brightness(1.12)}#nfl-night .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#nfl-night .panel{background:#15253d;border:1px solid #354c66;border-radius:10px;min-width:0;padding:14px}#nfl-night .panel h4{font-size:12px;font-weight:850;margin:0 0 13px}#nfl-night .wide{grid-column:1/-1}#nfl-night .field{margin-bottom:11px;min-width:0}#nfl-night label{display:block;font-size:11px;color:#b8cbdf;margin-bottom:6px}#nfl-night select,#nfl-night input[type=text]{width:100%;min-width:0;padding:9px;color:#f5f9ff;background:#0b192c;border:1px solid #435b7a;border-radius:7px;outline:none;font-size:12px}
#nfl-night .recordline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#b1c6dc;font-size:11px;margin-bottom:13px}#nfl-night .recordpill{font-weight:850;background:#2e4460;border:1px solid #506988;border-radius:6px;color:#fff;padding:4px 9px}#nfl-night .scores{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#nfl-night .scores output{font-size:28px;font-weight:900;min-width:33px}
#nfl-night .gamefields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}#nfl-night .stepper{display:flex;align-items:stretch;gap:3px}#nfl-night .stepper button{background:#2a4566;border:1px solid #52749a;border-radius:6px;color:#fff;font-size:17px;font-weight:900;min-width:30px;padding:5px 6px}#nfl-night .stepper output{flex:1;min-width:0;text-align:center;display:grid;place-items:center;background:#0c1b30;border:1px solid #4c6481;border-radius:6px;font-weight:950;font-size:14px;white-space:nowrap;padding:4px 2px}#nfl-night .quick{display:flex;flex-direction:column;gap:5px;margin-top:7px}#nfl-night .quick button{border:1px solid #415b78;background:#233955;color:#dceafa;border-radius:6px;font-size:10px;font-weight:850;padding:6px 3px}#nfl-night .quick button.active{border-color:#8fbbfb;background:#315899;color:#fff}
#nfl-night .clockfield{grid-column:span 2;min-width:0;padding:9px;background:#122239;border:1px solid #456186;border-radius:9px;margin-top:-9px}
#nfl-night .clockedit{display:flex;align-items:stretch;gap:5px}
#nfl-night .clockedit input{flex:1;min-width:0;text-align:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;padding:9px 3px}
#nfl-night .clockstep{background:#2a4566;color:#fff;border:1px solid #5477a1;border-radius:6px;padding:7px 10px;font-weight:900;font-size:13px;flex-shrink:0}
#nfl-night .clockactions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
#nfl-night .clockactions .btn{white-space:nowrap;font-size:10px;padding:8px 4px}
#nfl-night .clocknote{font-size:10px;color:#b6c8e0;margin-top:6px}
#nfl-night .posbox{background:#102036;border:1px solid #435975;border-radius:9px;padding:12px;margin:12px 0}#nfl-night .posbox strong{font-size:12px;display:block;margin-bottom:9px}#nfl-night .posbuttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#nfl-night .posbuttons button{padding:10px 6px;border:1px solid #425a79;border-radius:7px;color:#c0d1e4;background:#21374f;font-size:11px;font-weight:800}#nfl-night .posbuttons button.active{background:#2b61d7;color:white;border-color:#dbeafe}#nfl-night .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#nfl-night .colorfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}#nfl-night .colorbox{background:#102036;border:1px solid #39516d;border-radius:9px;padding:10px;min-width:0}#nfl-night .colorbox input[type=color]{display:block;width:100%;height:43px;background:#111e33;border:1px solid #7087a1;border-radius:7px;padding:3px;cursor:pointer}#nfl-night .colorbox small{display:block;color:#b4c6da;font-size:10px;margin-top:5px}#nfl-night .palette{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}#nfl-night .swatch{width:25px;height:25px;padding:0;border:2px solid #ffffff7a;border-radius:6px}
#nfl-night .setting{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #364a63;padding:13px 0;cursor:pointer}#nfl-night .setting b{display:block;font-size:12px;color:#f4f7ff}#nfl-night .setting small{display:block;color:#aabbcf;font-size:10px;margin-top:4px}#nfl-night .setting input{width:19px;height:19px;accent-color:#5b8af2}#nfl-night input[type=range]{width:100%;accent-color:#5b8af2}#nfl-night .foot{padding:12px 16px;border-top:1px solid #334760;color:#9eafc7;background:#121e33;display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;font-size:10px}
@media(max-width:600px){#nfl-night .content{padding:10px}#nfl-night .grid{grid-template-columns:1fr}#nfl-night .wide{grid-column:auto}#nfl-night .gamefields{grid-template-columns:repeat(2,minmax(0,1fr))}#nfl-night .clockfield{grid-column:span 2;margin-top:0}#nfl-night .stage{min-height:130px;padding:9px 3px}#nfl-night .scorebug{height:104px}#nfl-night .wing{height:67%}#nfl-night .wing.away{padding-right:9%}#nfl-night .wing.home{padding-left:9%}#nfl-night .team,#nfl-night .score{padding-bottom:5px}#nfl-night .postab{top:calc(50% + 33.5% - 1px);height:21px;font-size:clamp(8px,1.7cqw,12px)}#nfl-night .sports{gap:5px;padding:8px}#nfl-night .sports span{padding:7px 9px;font-size:10px}}

#nfl-night .obs-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
#nfl-night .obs-panel{background:#15253d;border:1px solid #3b506a;border-radius:10px;padding:16px;min-width:0}
#nfl-night .obs-panel h4{font-size:13px;margin:0 0 12px}
#nfl-night .obs-panel p{font-size:12px;color:#c2d2e6;line-height:1.6}
#nfl-night .obs-panel label{font-weight:700;margin-top:12px}
#nfl-night .obs-url-row{display:flex;gap:7px}
#nfl-night .obs-url-row input{flex:1;min-width:0}
#nfl-night .obs-steps{font-size:12px;color:#d6e4f6;line-height:1.9;padding-left:21px}
#nfl-night .obs-connected{font-size:11px;font-weight:800;margin-top:13px;color:#b8dfd1;background:#143c33;padding:10px;border-radius:7px}
#nfl-night .obs-connected.error{color:#ffd6b0;background:#52301f}
#nfl-night .obs-panel .obs-sub{font-size:11px;color:#9eb4cc}
@media(max-width:600px){#nfl-night .obs-layout{grid-template-columns:1fr}#nfl-night .obs-url-row{flex-wrap:wrap}#nfl-night .obs-url-row input{flex-basis:100%}}


html,body{margin:0;background:transparent!important;width:100%;height:100%;overflow:hidden}
#nfl-night{background:transparent!important;border:0!important;border-radius:0!important;width:100vw;height:100vh;overflow:visible!important}
#nfl-night .stage{width:100vw!important;height:100vh!important;min-height:0!important;padding:0!important;background:transparent!important;border:0!important;border-radius:0!important;display:flex;align-items:center;justify-content:center;overflow:visible!important}
#nfl-night .scorebug{max-width:1280px;height:min(220px,94vh)}
#nfl-night .wing{height:66%}
#nfl-night .postab{top:calc(50% + 33% - 1px);height:38px}
#nfl-night .scorebug{filter:drop-shadow(0 3px 5px #0009)}
@media(max-height:160px){#nfl-night .scorebug{height:90vh}#nfl-night .postab{height:20px}}

#nfl-night #nn-away-wing{background:linear-gradient(180deg,#0080c6,#0080c6 22%,#111b2e 160%);border-color:#ffc20e}
#nfl-night #nn-home-wing{background:linear-gradient(180deg,#002244,#002244 22%,#111b2e 160%);border-color:#c60c30}
#nfl-night #nn-away-tab{background:linear-gradient(180deg,#0080c6,#0080c6 70%,#111b2c);border-color:#ffc20e}
#nfl-night #nn-home-tab{background:linear-gradient(180deg,#002244,#002244 70%,#111b2c);border-color:#c60c30}
</style></head><body><div id="nfl-night"><div class="stage" id="nn-stage"><div class="scorebug" id="nn-bug"><div class="wing away" id="nn-away-wing"><div class="logo" id="nn-away-logobox"><img alt="Away team logo" id="nn-away-logo" src="https://raw.githubusercontent.com/frertommy/team-logos/main/NFL/AFC/Los%20Angeles%20Chargers/los-angeles-chargers_small_square.png"/><span class="fallback" id="nn-away-fallback">LAC</span></div><div class="team"><span class="abbr" id="nn-away-abbr">LAC</span><span class="record" id="nn-away-record">—</span></div><div class="score" id="nn-away-score">0</div></div><div class="wing home" id="nn-home-wing"><div class="score" id="nn-home-score">0</div><div class="team"><span class="abbr" id="nn-home-abbr">NE</span><span class="record" id="nn-home-record">—</span></div><div class="logo" id="nn-home-logobox"><img alt="Home team logo" id="nn-home-logo" src="https://raw.githubusercontent.com/frertommy/team-logos/main/NFL/AFC/New%20England%20Patriots/new-england-patriots_small_square.png"/><span class="fallback" id="nn-home-fallback">NE</span></div></div><div class="postab away" id="nn-away-tab"><span>▶</span><span id="nn-away-down">3RD &amp; 6</span></div><div class="postab home" hidden="" id="nn-home-tab"><span id="nn-home-down">3RD &amp; 6</span><span>◀</span></div><div class="center"><span class="symbol">✦ ◉ ✦</span><span class="clock" id="nn-clock">13:04</span><div class="clockline"><span id="nn-quarter">1ST</span><span class="playclock" id="nn-playclock">06</span></div></div></div></div></div><script>
(function(){
'use strict';const $=id=>document.getElementById(id);let version=-1;
function set(id,x){$(id).textContent=String(x??'')}
function draw(s){if(!s)return;
 ['away','home'].forEach(side=>{const p='nn-'+side+'-',v=s[side];if(!v)return;
  set(p+'abbr',v.code);set(p+'record',v.record);set(p+'score',v.score);set(p+'fallback',v.code);set(p+'down',v.tabText);
  const wing=$(p+'wing');if(v.wingBg)wing.style.background=v.wingBg;if(v.wingBorder)wing.style.borderColor=v.wingBorder;
  const tab=$(p+'tab');tab.hidden=!!v.tabHidden;if(v.tabBg)tab.style.background=v.tabBg;if(v.tabBorder)tab.style.borderColor=v.tabBorder;
  const box=$(p+'logobox');box.style.visibility=v.logoHidden?'hidden':'visible';$(p+'record').style.visibility=v.recordHidden?'hidden':'visible';
  const img=$(p+'logo');if(v.logoUrl&&img.src!==v.logoUrl){box.classList.remove('failed');img.src=v.logoUrl;}
 });
 set('nn-clock',s.clock);set('nn-quarter',s.quarter);set('nn-playclock',s.playclock);
 $('nn-clock').style.visibility=s.clockHidden?'hidden':'visible';$('nn-playclock').hidden=!!s.playclockHidden;
 $('nn-bug').style.maxWidth=s.scale||'100%';
}
['away','home'].forEach(side=>{const wrap=$('nn-'+side+'-logobox'),img=$('nn-'+side+'-logo');img.onerror=()=>wrap.classList.add('failed');img.onload=()=>wrap.classList.remove('failed')});
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return;const x=await r.json();if(x.version!==version){version=x.version;draw(x.state)}}catch(e){}}
poll();setInterval(poll,300);
})();
</script></body></html>
